<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Login do TikTok · Garimpei Smart</title>
<style>
  :root { --fundo: #fbf6ef; --texto: #221c17; --suave: #7a6f64; --laranja: #ee4d2d; --caixa: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #15110e; --texto: #fbf6ef; --suave: #c9bfb3; --caixa: #221c17; } }
  body { margin: 0; background: var(--fundo); color: var(--texto); font-family: system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  textarea { width: 100%; box-sizing: border-box; min-height: 110px; padding: 12px; border-radius: 12px; font: 14px monospace;
             background: var(--caixa); color: var(--texto); border: 1px solid var(--suave); }
  button { margin-top: 12px; background: var(--laranja); color: #fff; border: 0; border-radius: 999px; padding: 10px 20px; font-size: 1rem; }
  p { color: var(--suave); }
</style>
</head>
<body>
<main>
  <!-- Retorno do login do TikTok (Login Kit): mostra o código para colar no garimpei -->
  <h1 id="titulo">Login do TikTok</h1>
  <p id="texto">Copie o endereço completo abaixo e cole na conversa do garimpei. Ele vale por poucos minutos.</p>
  <textarea id="codigo" readonly></textarea>
  <button id="copiar" type="button">Copiar</button>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const campo = document.getElementById("codigo");
  if (params.get("error")) {
    document.getElementById("titulo").textContent = "O login não foi autorizado";
    document.getElementById("texto").textContent = params.get("error_description") || params.get("error");
    campo.hidden = document.getElementById("copiar").hidden = true;
  } else {
    campo.value = location.href;
    // Se o painel do garimpei estiver rodando neste computador, conclui o login sozinho
    fetch("http://127.0.0.1:47800/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endereco: location.href }) })
      .then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.erro); return j; })
      .then(({ conta }) => {
        document.getElementById("titulo").textContent = "✔ Conta do TikTok conectada";
        document.getElementById("texto").innerHTML = "";
        document.getElementById("texto").append("Conta conectada ao garimpei. ", Object.assign(document.createElement("a"), { href: "aprovar.html", textContent: "Voltar para a aprovação dos posts" }));
        campo.hidden = document.getElementById("copiar").hidden = true;
      })
      .catch(() => {});
  }
  document.getElementById("copiar").addEventListener("click", async () => {
    campo.select();
    try { await navigator.clipboard.writeText(campo.value); } catch { document.execCommand("copy"); }
    document.getElementById("copiar").textContent = "Copiado!";
  });
</script>
</body>
</html>
